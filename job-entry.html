
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Job Entry | Leandsay Lee</title>

  <style>
    :root {
      --blue: #0844ac;
      --ink: #17233b;
      --muted: #68758b;
      --line: #e6ebf3;
      --surface: #fff;
      --bg: #f4f7fc;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: Arial, Helvetica, sans-serif;
    }

    /* SAME HEADER STYLE AS HOMEPAGE */
    header {
      background: #fff;
      border-bottom: 1px solid var(--line);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .nav-wrap {
      max-width: 1240px;
      margin: auto;
      padding: 14px 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
    }

    .brand {
      font-weight: 800;
      color: var(--blue);
      letter-spacing: .2px;
      white-space: nowrap;
      text-decoration: none;
    }

    nav {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    nav a {
      display: inline-block;
      padding: 10px 14px;
      border-radius: 9px;
      text-decoration: none;
      color: #31415c;
      font-size: 13px;
      font-weight: 700;
      border: 1px solid transparent;
    }

    nav a:hover,
    nav a.active {
      background: #eaf1ff;
      color: var(--blue);
      border-color: #d8e5ff;
    }

    /* PAGE CONTENT */
    main {
      max-width: 1240px;
      margin: 26px auto;
      padding: 0 22px 40px;
    }

    .page-heading {
      margin-bottom: 20px;
    }

    .page-heading h1 {
      margin: 0 0 8px;
      font-size: 26px;
      color: var(--ink);
    }

    .page-heading p {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 22px;
      box-shadow: 0 4px 15px rgba(25, 45, 85, .04);
    }

    .form-frame {
      width: 100%;
      min-height: 850px;
      border: none;
      display: block;
      background: #fff;
    }

    @media (max-width: 800px) {
      .nav-wrap {
        align-items: flex-start;
        flex-direction: column;
      }

      nav {
        justify-content: flex-start;
      }

      main {
        margin-top: 18px;
      }
    }

    @media (max-width: 480px) {
      main {
        padding: 0 12px 28px;
      }

      .nav-wrap {
        padding: 12px;
      }

      .card {
        padding: 17px;
      }

      .page-heading h1 {
        font-size: 22px;
      }
    }
  </style>
</head>

<body>

  <!-- TOP NAVIGATION -->
  <header>
    <div class="nav-wrap">

      <a class="brand" href="index.html#home">
        LEANDSAY LEE
      </a>

      <nav aria-label="Main navigation">
        <a href="index.html#home">Home</a>
        <a href="index.html#about">About</a>
        <a href="index.html#projects">Projects</a>
        <a href="design-tools.html">Design Tools</a>
        <a href="design-sop.html">Design SOP</a>
        <a class="active" href="job-entry.html">Job Entry</a>
        <a href="index.html#resources">Resources</a>
        <a href="index.html#contact">Contact</a>
      </nav>

    </div>
  </header>

  <!-- MAIN CONTENT -->
  <main>

    <div class="page-heading">
      <h1>Job Entry Form</h1>
      <p>
        Submit and record your daily job entries using the form below.
      </p>
    </div>

    <section class="card">

      <iframe
        class="form-frame"
        src="YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL"
        title="Job Entry Form"
        loading="lazy">
      </iframe>

    </section>

  </main>

</body>
</html>
