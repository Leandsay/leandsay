.form-container {

    overflow: hidden;
    border: 1px solid #e5e7eb;

.form-container iframe {
    width: 100%;
    height: 1250px;
    border: none;
    display: block;
}

.footer {
    text-align: center;
    padding: 25px 15px;
    color: #888;
    font-size: 12px;
}

/* MOBILE */
@media(max-width: 600px) {
    header {
        padding: 20px 12px 15px;
    }

    .site-title {
        font-size: 23px;
    }

    nav {
        gap: 15px;

        padding: 0 10px;
